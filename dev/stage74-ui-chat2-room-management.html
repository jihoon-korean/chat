async function beginRejoin(){if(busy||pending)return;if(rejoinPending){openRejoinDialog();status('기존 재입장 요청으로 계속 진행해 주세요.');return}const r=room();if(!r){status('채팅방 선택 정보가 일치하지 않습니다. 새로고침 후 다시 선택해 주세요.');return}if(r.my_active){status('이미 참여 중인 채팅방입니다. 재입장 요금은 청구되지 않습니다.');return}roomId=r.room_id;selected=r.my_persona;resetMessageView();rejoinPending={requestId:crypto.randomUUID(),room:r.room_id,persona:r.my_persona,confirmed:false};saveRejoin();openRejoinDialog();lock()}
async function rejoin(approve=false){if(busy||!rejoinPending||!user)return;if(approve){rejoinPending.confirmed=true;saveRejoin()}if(!rejoinPending.confirmed){openRejoinDialog();status('100P 재입장 승인이 필요합니다.');return}busy=true;lock();status('동일 요청 ID로 재입장 결과를 확인 중…');try{const p=rejoinPending;const data=await api.rejoinRoom(p.room,p.persona,true,p.requestId);clearRejoin();roomId=p.room;selected=p.persona;$('stage71Persona').value=selected;resetMessageView();await reloadRooms();$('stage71Room').value=roomId;await loadMessages();status(data?.replayed?'재입장 요청 재확인 완료 · 중복 차감 없음':data?.charged?'100P 차감 및 재입장 완료 · 이전 메시지 비공개':'이미 참여 중인 채팅방입니다. 추가 차감 없음')}catch(e){status(String(e.message||e).includes('INSUFFICIENT_POINTS')?'포인트가 부족합니다. 충전 후 동일 재입장 요청으로 다시 확인하세요.':'재입장 결과가 불확실합니다. 새 요청을 만들지 말고 재입장 요청 재확인을 사용하세요. '+String(e.message||e))}finally{busy=false;lock()}}
function refreshRoomActions(){const selector=$('stage71Room'),personaSelector=$('stage71Persona');const id=selector?.value||roomId;const persona=personaSelector?.value||selected;if(id&&roomId!==id)roomId=id;const r=rooms.find(x=>String(x.room_id)===String(id)&&String(x.my_persona)===String(persona));const leaveBtn=$('stage74Leave'),rejoinBtn=$('stage74Rejoin'),topBtn=$('stage74RejoinTop'),state=$('stage74RoomState');if(!leaveBtn||!rejoinBtn)return;const active=!!r?.my_active;const departed=!!r&&!active;leaveBtn.hidden=!active;leaveBtn.style.display=active?'inline-flex':'none';rejoinBtn.hidden=false;rejoinBtn.style.display='inline-flex';leaveBtn.disabled=busy||!!pending||!!rejoinPending;rejoinBtn.disabled=!id||active||busy||!!pending||!!rejoinPending;if(topBtn){topBtn.hidden=false;topBtn.style.display='inline-flex';topBtn.disabled=!id||active||busy||!!pending||!!rejoinPending;topBtn.textContent=!id?'채팅방 선택 후 재입장':active?'참여 중 (재입장 불필요)':'100P 재입장';}rejoinBtn.textContent=!id?'채팅방 선택 필요':active?'참여 중':'100P 재입장';if(state)state.textContent=departed?'퇴장 상태 · 이전 메시지 비공개 · 100P 재입장 필요':id&&!r?'채팅방 상태 확인 필요 · 재입장 클릭 시 서버 상태 재확인':active?'참여 중':'채팅방을 선택하세요'}

$('stage70Close').onclick=close;$('stage70Dialog').onclick=e=>{if(e.target===$('stage70Dialog'))close()};
$('stage70Profile').onclick=()=>dialog('프로필','기존 프로필 버튼의 디자인을 유지합니다. 실제 프로필 팝업은 후속 단계에서 연결합니다.');
$('stage70Back').onclick=()=>dialog('뒤로가기','독립 통합 테스트 페이지입니다.');
$('stage70Attach').onclick=()=>dialog('사진 첨부','Stage74는 텍스트 메시지만 서버에 연결했습니다.');
$('stage74ConfirmRejoin').onclick=()=>rejoin(true);$('stage74CancelRejoin').onclick=()=>{$('stage74RejoinDialog').hidden=true;status('재입장 승인을 보류했습니다. 같은 요청으로만 재확인하세요.')};$('stage74Recover').onclick=()=>rejoin(false);$('stage74Leave').onclick=leave;$('stage74Rejoin').onclick=beginRejoin;$('stage74RejoinTop').onclick=beginRejoin;
$('stage70More').onclick=()=>{const old=$('mbChatMoreMenu');if(old){old.remove();return}const menu=document.createElement('div');menu.className='mb-chat-menu';menu.id='mbChatMoreMenu';for(const title of ['채팅방 나가기','차단하기','신고하기']){const b=document.createElement('button');b.type='button';b.textContent=title;b.onclick=()=>{menu.remove();if(title==='채팅방 나가기')leave();else dialog(title,'차단·신고 메뉴 디자인만 보존했습니다. 서버 요청은 실행하지 않습니다.')};menu.append(b)}$('mbRealHeader').append(menu)};
$('stage71Persona').onchange=e=>selectPersona(e.target.value);
$('stage71Room').onchange=async e=>{if(pending||rejoinPending)return;roomId=e.target.value;selected=$('stage71Persona').value||selected;resetMessageView();setHeader();lock();refreshRoomActions();if(roomId&&!room()?.my_active){status('나간 채팅방입니다. 100P 재입장 버튼을 누르세요.');return}try{await loadMessages()}catch(err){status('메시지 조회 실패: '+String(err.message||err))}};
$('stage71Reload').onclick=async()=>{if(pending||rejoinPending){status('미확인 요청을 먼저 복구하세요.');return}try{await reloadRooms();await loadMessages()}catch(e){status(String(e.message||e))}};
$('stage70Composer').onsubmit=e=>{e.preventDefault();send().catch(e=>status(String(e.message||e)))};
$('stage72Retry').onclick=()=>send(true,false);
$('stage72Approve').onclick=()=>{$('stage72Payment').hidden=true;send(true,true)};
$('stage72Cancel').onclick=()=>{$('stage72Payment').hidden=true;status('승인을 보류했습니다. 요청 ID가 유지됩니다. 동일 요청 재확인으로 계속하세요.')};
if(!window.supabase||!window.MB61Chat2Adapter){status('SDK 또는 어댑터 로드 실패');return}
client=window.supabase.createClient(URL,KEY,{auth:{storageKey:'meetbridge-chat2-dev-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
api=new MB61Chat2Adapter(client);$('stage73Jump').onclick=()=>{forceBottom=true;const box=$('messages');box.scrollTop=box.scrollHeight;$('stage73Jump').hidden=true;loadMessages()};$('messages').addEventListener('scroll',()=>{if(atBottom($('messages')))$('stage73Jump').hidden=true});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadMessages()});setInterval(()=>{if(user&&document.visibilityState==='visible'){refreshRoomActions();if(roomId)loadMessages()}},2500);safeLoad();
})();
</script></body></html>
