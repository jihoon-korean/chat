function defaults(){return {points:3500,loggedIn:false,tab:'find',filter:'전체',friendFilter:'관심',posts:sample,likes:[],blocks:[],memos:{},chats:{},profile:{name:'',gender:'남',age:29,image:'',spec:{키:'',몸무게:'',가슴:'선택안함',허리:'',힙:'',외모스타일:'선택안함',체형스타일:'선택안함',MBTI:'선택안함',흡연:'선택안함',음주:'선택안함'},intro:'',photos:[]},checkin:'',profileSaved:false,incomingBlocks:[]}}let state;try{state={...defaults(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state=defaults()}if(!state.profileSaved && !state.profile?.image && !state.profile?.photos?.length){const blank=defaults().profile;state.profile={...blank,age:state.profile?.age||blank.age}}state.profileSaved=!!state.profileSaved;state.incomingBlocks=state.incomingBlocks||[];state.loggedIn=false;state.likes=[];state.blocks=[];state.profile=JSON.parse(JSON.stringify(defaults().profile));state.profileSaved=false;let viewerIndex=0,viewerImages=[],restoreEditScroll=null;let page='main',profileId=null,profileTab='프로필',modal=null,menu=false,editDraft=null,dirty=false,chatId=null,toastTimer,modalReturn=null;const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));function notify(msg){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=msg;app.append(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),2300)}function nav(tab){if(tab==='find'&&authUser?.id)mbLoadMembers();if(tab==='friends'&&authUser?.id&&mbRelationUser===authUser.id&&!mbRelationBusy)mbLoadRelations(authUser.id);page='main';state.tab=tab;menu=false;modal=null;editDraft=null;restoreEditScroll=null;save();render()}function head(){return `<div class="head"><button type="button" class="brand" onclick="nav('find')" aria-label="MEETBRIDGE 홈, 친구찾기로 이동">MEETBRIDGE</button><button class="points" onclick="go('points')">${state.points.toLocaleSt // v0.15: 실제 회원은 demo ID가 아닌 auth.users UUID로 구분합니다.
let mbMembers=[],mbMembersLoadedFor=null,mbMemberRelations={},mbMemberBusy=false,mbLatestTitles={};
async function mbLoadMembers(){
 if(!authUser||!authReady())return;
 const uid=authUser.id;
 try{
  const {data,error}=await sbClient.from('profiles').select('id,nickname,gender,age,introduction,profile_photo_url,photos,spec,profile_saved').eq('profile_saved',true).neq('id',uid).limit(100);
  if(error)throw error;
  if(authUser?.id!==uid)return;
  mbMembers=(data||[]).filter(p=>p.id!==uid);mbMembersLoadedFor=uid;
  // 게시글 제목은 프로필 소개글과 별도로 서버에서 불러옵니다.
  const {data:postRows,error:postError}=await sbClient.from('member_posts').select('user_id,title,created_at').order('created_at',{ascending:false}).limit(500);
  if(postError)throw postError;
  if(authUser?.id!==uid)return;
  mbLatestTitles={};for(const post of (postRows||[])){if(!Object.prototype.hasOwnProperty.call(mbLatestTitles,post.user_id))mbLatestTitles[post.user_id]=post.title;}
  render();
 }catch(e){console.error('실제 회원 불러오기 오류',e);notify('실제 회원 목록을 불러오지 못했습니다: '+e.message)}
}
function mbMemberSection(){
 if(!authUser)return '';
 const items=mbMembers.filter(p=>p.id!==authUser.id);
 return `<div class="mb-real-title"><b>실제 가입 회원</b><button onclick="mbLoadMembers()">새로고침 ↻</button></div>${items.length?items.map(p=>`<div class="card mb-member-card"><div class="avatar" onclick="mbOpenMember('${p.id}')"><img src="${esc(p.profile_photo_url||defaultAvatar(p.gender))}" alt="프로필 사진"></div><div class="cardbody" onclick="mbOpenMember('${p.id}')"><div class="ident ${p.gender==='남'?'man':''}">${esc(p.gender||'')} ${Number(p.age)||29}세. ${esc(p.nickname||'사용자')}</div><div class="headline">${esc(mbLatestTitles[p.id]||'작성한 글이 없습니다')}</div><div class="meta">실제 가입 회원 · 거리 미확인</div></div><button class="chatbtn" onclick="mbMemberChat('${p.id}')">채팅</button></div>`).join(''):'<div class="mb-member-empty">아직 공개 프로필을 저장한 다른 회원이 없습니다.</div>'}<div class="mb-real-title"><b>테스트 회원</b><span>가상 프로필</span></div>`;
}
function mbOpenMember(id){
 if(!authUser){modal={type:'needlogin'};render();return}
 if(id===authUser.id){previewMyProfile();return}
 const p=mbMembers.find(p=>p.id===id);if(!p)return notify('회원 프로필을 찾지 못했습니다.');
 profileTab='프로필';modal={type:'member',id};render();mbLoadMemberMemo(id);
}
function mbMemberModal(){
 const p=mbMembers.find(x=>x.id===modal.id);if(!p)return '';
 const key='user:'+p.id,relation=mbMemberRelations[key];
 const details=Object.entries(p.spec||{}).filter(([k])=>p.gender==='여'||!['가슴','허리','힙'].includes(k)).map(([k,v])=>`<span>${esc(k)}</span><span>${esc(v)}${k==='키'&&v?' cm':k==='몸무게'&&v?' kg':''}</span>`).join('');
 const content=profileTab==='프로필'?`<div class="spec">${details||'등록된 정보가 없습니다.'}</div>`:profileTab==='소개글'?`<div style="white-space:pre-wrap;line-height:1.8">${esc(p.introduction||'등록된 소개글이 없습니다.')}</div>`:`<div class="photos">${(p.photos||[]).map(x=>`<div class="photo"><img src="${esc(x)}" alt="프로필 사진"></div>`).join('')||'<div class="empty">등록된 사진이 없습니다.</div>'}</div>`;
 const memoContent=`<textarea class="wide memo-box" id="mbMemberMemo" maxlength="500" placeholder="상대방의 특징을 메모로 남겨보세요." oninput="mbMemoCount(this)">${esc(mbMemberMemos[p.id]||'')}</textarea><div class="sectionfoot"><span class="tiny memo-limit" id="mbMemoCounter">${(mbMemberMemos[p.id]||'').length}/500자</span><button class="action" onclick="mbSaveMemberMemo('${p.id}')">저장</button></div>`;
 const shownContent=profileTab==='메모하기'?memoContent:content;
 return `<div class="modalbg" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modalSummary"><div class="modal-avatar-tap" onclick="mbOpenMemberPhoto('${p.id}')"><div class="avatar large"><img src="${esc(p.profile_photo_url||defaultAvatar(p.gender))}"></div></div><div class="grow"><div class="ident ${p.gender==='남'?'man':''}">${esc(p.gender||'')} ${Number(p.age)||29}세. ${esc(p.nickname||'사용자')}</div><div class="meta">실제 가입 회원</div></div><button class="action ${relation==='like'?'gray':''}" onclick="mbSetMemberRelation('${p.id}','like')">${relation==='like'?'관심 해제':'관심'}</button><button class="action gray" onclick="notify('실제 회원 간 채팅은 다음 버전에서 연결됩니다.')">채팅</button></div><div class="modtabs">${['프로필','소개글','사진','메모하기'].map(t=>`<button class="${profileTab===t?'on':''}" onclick="profileTab='${t}';render()">${t}</button>`).join('')}<button onclick="mbSetMemberRelation('${p.id}','block')">${relation==='block'?'차단 해제':'차단하기'}</button></div><div class="modalcontent">${shownContent}</div><div class="modalfooter"><button onclick="modal=null;render()" style="background:none;padding:5px 30px">닫기</button></div></div></div>`;
}
// 실제 회원 간 채팅은 서버 연결 전까지 시작하지 않습니다.
function mbMemberChat(id){if(!mbMembers.some(p=>p.id===id))return;notify('실제 회원 간 채팅은 다음 단계에서 연결됩니다.');}
// 메모는 상대방에게 공개되지 않으며 로그인 계정에만 귀속됩니다.
let mbMemberMemos={},mbMemoUser=null;
function mbMemoCount(el){const counter=document.getElementById('mbMemoCounter');if(counter)counter.textContent=el.value.length+'/500자';}
async function mbLoadMemberMemo(id){
 if(!authUser||!sbClient)return;
 const uid=authUser.id;
 if(mbMemoUser!==uid){mbMemberMemos={};mbMemoUser=uid;}
 try{
  const {data,error}=await sbClient.from('member_memos').select('memo').eq('user_id',uid).eq('target_user_id',id).maybeSingle();
  if(error)throw error;
  if(authUser?.id!==uid)return;
  mbMemberMemos[id]=data?.memo||'';
  if(modal?.type==='member'&&modal.id===id&&profileTab==='메모하기')render();
 }catch(e){console.error('메모 불러오기 실패',e);notify('메모 불러오기 실패: '+e.message)}
}
async function mbSaveMemberMemo(id){
 if(!authUser||id===authUser.id)return;
 const input=document.getElementById('mbMemberMemo');if(!input)return;
 const memo=input.value.slice(0,500),uid=authUser.id;
 try{
  const {error}=await sbClient.from('member_memos').upsert({user_id:uid,target_user_id:id,memo,updated_at:new Date().toISOString()},{onConflict:'user_id,target_user_id'});
  if(error)throw error;
  if(authUser?.id!==uid)return;
  mbMemberMemos[id]=memo;notify('메모를 저장했습니다. 다른 기기에서도 확인할 수 있습니다.');
 }catch(e){notify('메모 저장 실패: '+e.message)}
}
function mbOpenMemberPhoto(id){const p=mbMembers.find(x=>x.id===id);if(!p)return;viewerImages=[p.profile_photo_url||defaultAvatar(p.gender)];viewerIndex=0;showViewer()}
async function mbSetMemberRelation(id,action){
 if(!authUser||id===authUser.id)return notify('자신은 관심·차단할 수 없습니다.');
 if(mbMemberBusy)return notify('저장 중입니다.');
 const key='user:'+id,old=mbMemberRelations[key]||null,next=old===action?null:action,uid=authUser.id;
 mbMemberBusy=true;
 try{
  const q=sbClient.from('member_relationships');
  const {error}=next?await q.upsert({user_id:uid,target_key:key,relation:next},{onConflict:'user_id,target_key'}):await q.delete().eq('user_id',uid).eq('target_key',key);
  if(error)throw error;
  if(authUser?.id!==uid)return;
  if(next)mbMemberRelations[key]=next;else delete mbMemberRelations[key];
  render();notify(next==='like'?'관심 회원으로 등록했습니다.':next==='block'?'회원을 차단했습니다.':'관계를 해제했습니다.');
 }catch(e){notify('저장 실패: '+e.message)}finally{mbMemberBusy=false}
}
function mbMemberFriendSection(blocked){

 if(!list.length)return '';
 return `<div class="mb-real-title"><b>실제 가입 회원</b></div>`+list.map(p=>`<div class="card mb-member-card"><div class="avatar" onclick="mbOpenMember('${p.id}')"><img src="${esc(p.profile_photo_url||defaultAvatar(p.gender))}"></div><div class="cardbody" onclick="mbOpenMember('${p.id}')"><div class="ident">${esc(p.nickname||'사용자')}</div><div class="meta">실제 가입 회원</div></div><button class="chatbtn" onclick="mbSetMemberRelation('${p.id}','${blocked?'block':'like'}')">${blocked?'차단 해제':'관심 해제'}</button></div>`).join('');
}

// Convert camera/gallery images to a smaller JPEG before saving to localStorage.
// This demo stores messages on-device; a production app needs an upload server.
function prepareChatImage(file){
  return new Promise((resolve,reject)=>{
    if(file.size>35*1024*1024){reject(new Error('사진 용량이 너무 큽니다. 35MB 이하 사진을 선택해 주세요.'));return}
    const objectUrl=URL.createObjectURL(file);
    const img=new Image();
    const cleanup=()=>URL.revokeObjectURL(objectUrl);
    img.onload=()=>{
      try{
        const maxEdge=1000;
        const ratio=Math.min(1,maxEdge/Math.max(img.naturalWidth,img.naturalHeight));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));
        canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));
        const ctx=canvas.getContext('2d');
        if(!ctx)throw new Error('이 기기에서 사진을 처리할 수 없습니다.');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        const data=canvas.toDataURL('image/jpeg',.72);
        cleanup();
        if(!data||data.length>2*1024*1024)throw new Error('사진을 압축하지 못했습니다. 다른 사진을 선택해 주세요.');
        resolve(data);
      }catch(err){cleanup();reject(err)}
    };
    img.onerror=()=>{cleanup();reject(new Error('사진을 읽지 못했습니다. JPEG 또는 PNG 사진을 선택해 주세요.'))};
    img.src=objectUrl;
  });

function mbClearRelations(){mbMemberMemos={};mbMemoUser=null;++mbRelationSeq;mbRelationUser=null;mbMemberRelations={};mbMembers=[];mbMembersLoadedFor=null;mbLatestTitles={};state.likes=[];state.blocks=[];save()}
async function mbLoadRelations(userId){
 const seq=++mbRelationSeq;mbRelationUser=null;state.likes=[];state.blocks=[];save();render();
 try{
  const {data,error}=await sbClient.from('member_relationships').select('target_key,relation').eq('user_id',userId);
  if(error)throw error;
  if(seq!==mbRelationSeq||authUser?.id!==userId)return;
  state.likes=(data||[]).filter(x=>x.relation==='like'&&/^demo:[0-9]+$/.test(x.target_key)).map(x=>Number(x.target_key.slice(5)));
  state.blocks=(data||[]).filter(x=>x.relation==='block'&&/^demo:[0-9]+$/.test(x.target_key)).map(x=>Number(x.target_key.slice(5)));
  mbMemberRelations={};for(const x of (data||[])){if(/^user:[0-9a-f-]{36}$/i.test(x.target_key))mbMemberRelations[x.target_key]=x.relation;}mbRelationUser=userId;save();render();
 }catch(e){if(seq!==mbRelationSeq)return;console.error('관심/차단 불러오기 실패',e);notify('관심·차단 목록을 불러오지 못했습니다: '+(e.message||'오류'));}
}
async function mbChangeRelation(id,action){
 if(!authUser){modal={type:'needlogin'};render();return}
 if(mbRelationUser!==authUser.id){notify('관심·차단 목록을 불러오는 중입니다. 잠시 후 다시 시도해 주세요.');return}
 if(mbRelationBusy){notify('이전 변경사항을 저장하는 중입니다.');return}
 const n=Number(id);if(n===0){notify('본인은 관심·차단할 수 없습니다.');return}if(!Number.isSafeInteger(n)||!state.posts.some(p=>p.id===n)){notify('대상 회원을 확인할 수 없습니다.');return}
 const oldLikes=[...state.likes],oldBlocks=[...state.blocks];
 let relation=null;
 if(action==='like')relation=state.likes.includes(n)?null:'like';
 else if(action==='block')relation='block';
 else if(action==='unblock')relation=null;
 else return;
 if(relation==='like'){state.likes=[...state.likes.filter(x=>x!==n),n];state.blocks=state.blocks.filter(x=>x!==n)}
 else if(relation==='block'){state.blocks=[...state.blocks.filter(x=>x!==n),n];state.likes=state.likes.filter(x=>x!==n)}
 else{state.likes=state.likes.filter(x=>x!==n);state.blocks=state.blocks.filter(x=>x!==n)}
 const userId=authUser.id;mbRelationBusy=true;save();render();
 try{
  const q=sbClient.from('member_relationships');
  const {error}=relation?await q.upsert({user_id:userId,target_key:'demo:'+n,relation},{onConflict:'user_id,target_key'}):await q.delete().eq('user_id',userId).eq('target_key','demo:'+n);
  if(error)throw error;
  if(authUser?.id!==userId)return;
  notify(action==='block'?'상대를 차단했습니다.':action==='unblock'?'차단을 해제했습니다.':relation==='like'?'관심 친구로 등록했습니다.':'관심을 해제했습니다.');
 }catch(e){console.error('관심/차단 저장 실패',e);if(authUser?.id===userId){state.likes=oldLikes;state.blocks=oldBlocks;save();render();notify('서버 저장에 실패했습니다: '+(e.message||'오류'))}}
 finally{mbRelationBusy=false}
}

function mbAutoNickname(userId){
 if(!userId)return '사용자';
 const hex=userId.replace(/-/g,'').slice(-10);
 return '사용자'+(parseInt(hex,16)%900000+100000);
}
function mbBlankProfile(){return JSON.parse(JSON.stringify(defaults().profile))}
function mbClearLocalProfile(){state.profile=mbBlankProfile();state.profileSaved=false;editDraft=null;dirty=false;save()}
function mbDataUrlBlob(url){const parts=url.split(','),mime=(parts[0].match(/data:([^;]+)/)||[])[1]||'image/jpeg';const bytes=atob(parts[1]),arr=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);return new Blob([arr],{type:mime})}
async function mbUploadImage(value,kind){
 if(!value||!value.startsWith('data:image/'))return value||'';
 const blob=mbDataUrlBlob(value);if(blob.size>5*1024*1024)throw Error('사진은 장당 5MB 이하여야 합니다.');
 const ext=blob.type==='image/png'?'png':blob.type==='image/webp'?'webp':'jpg';
 const path=authUser.id+'/'+kind+'-'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;
 const {error}=await sbClient.storage.from('profile-photos').upload(path,blob,{contentType:blob.type,upsert:false});
 if(error)throw Error('사진 업로드 오류: '+error.message);
 return sbClient.storage.from('profile-photos').getPublicUrl(path).data.publicUrl;
}
async function mbLoadProfile(userId){

  const {data,error}=await sbClient.from('profiles').select('id,nickname,gender,introduction,profile_photo_url,spec,photos,age,profile_saved').eq('id',userId).maybeSingle();
  if(error)throw error;
  if(seq!==mbLoadSeq||authUser?.id!==userId)return;
  if(data){state.profile={...mbBlankProfile(),name:data.nickname||mbAutoNickname(userId),gender:data.gender||'남',intro:data.introduction||'',image:data.profile_photo_url||'',spec:{...mbBlankProfile().spec,...(data.spec||{})},photos:Array.isArray(data.photos)?data.photos:[],age:data.age||29};state.profileSaved=!!data.profile_saved}
  else{mbClearLocalProfile();state.profile.name=mbAutoNickname(userId);state.profile.gender='남'}
  if(data&&!state.profile.name)state.profile.name=mbAutoNickname(userId);
  mbLoadedUserId=userId;mbLoadingUserId=null;save();render();
 }catch(e){console.error('Profile load failed',e);if(seq===mbLoadSeq)notify('프로필을 불러오지 못했습니다: '+e.message)}
}
function applyAuthSession(session){
 const next=session?.user||null,oldId=authUser?.id||null;
 authUser=next;state.loggedIn=!!next;
 if(!next){mbClearRelations();++mbLoadSeq;mbLoadedUserId=null;mbLoadingUserId=null;mbClearLocalProfile()}
 else if(oldId!==next.id||(mbLoadedUserId!==next.id&&mbLoadingUserId!==next.id)){mbClearRelations();mbLoadRelations(next.id);mbClearLocalProfile();mbLoadProfile(next.id);mbLoadMembers()}
 save();
}

putmode="numeric" pattern="[0-9]*" oninput="this.value=this.value.replace(/[^0-9]/g,'');updateSpec('${k}',this.value)">${['키','몸무게'].includes(k)?`<span class="unit">${k==='키'?'cm':'kg'}</span>`:''}</div>`}</div>`).join('')}</div><div class="section"><div class="sectiontitle" style="color:var(--pink)">소개글</div><textarea class="wide" placeholder="정성스러운 소개일수록 매칭 성공률이 높아집니다" oninput="editDraft.intro=this.value;dirty=true">${esc(p.intro)}</textarea></div><div class="section"><div class="sectiontitle" style="color:var(--pink)">사진 <span class="tiny">최대 6장 · 서버에 저장됩니다</span></div><div class="photogrid">${Array.from({length:6},(_,i)=>p.photos[i]?`<div class="photocell"><img src="${p.photos[i]}"><button class="remove" onclick="removePhoto(${i})">×</button></div>`:`<div class="photocell" onclick="chooseProfilePhotos()" style="cursor:pointer;color:#999;font-size:28px">＋</div>`).join('')}</div><input type="file" id="photoFile" accept="image/*" multiple hidden onchange="uploadPhotos(event)"></div></div><div class="edit-save-bar"><button id="saveAllBtn" class="action" onclick="saveAllProfile()" ${hasUnsaved()?'':'disabled'}>저장</button></div>`}

 const chosen=[...e.target.files];e.target.value='';if(!chosen.length)return;

 })));
 if(results.some(x=>!x)){modal={type:'photoFileError'};render();return;}
 restoreEditScroll=document.getElementById('editScroller')?.scrollTop||0;
 editDraft.photos.push(...results);refreshSaveButton();render();

function confirm(){if(!modal)return '';const m=modal;let title='',body='',actions='';if(m.type==='photoLimit'){title='사진 등록 제한';body='프로필 사진은 최대 6장까지 등록할 수 있습니다. 기존에 등록한 사진을 포함하여 6장을 초과할 수 없습니다.';actions=`<button class="action" onclick="modal=null;render()">확인</button>`}else if(m.type==='photoFileError'){title='사진을 등록할 수 없습니다';body='사진은 장당 5MB 이하의 이미지 파일만 선택할 수 있습니다.';actions=`<button class="action" onclick="modal=null;render()">확인</button>`}else if(m.type==='selfBlocked'){title='채팅방을 열 수 없습니다';body='회원님이 차단한 상대입니다.';actions=`<button class="action" onclick="modal=null;render()">확인</button>`}else if(m.type==='block'){title='상대를 정말 차단할까요?';body='상대의 메세지를 차단할 수 있습니다.';actions=`<button class="action gray" onclick="modal={type:'profile'};render()">취소</button><button class="action danger" onclick="doBlock(${m.id})">차단하기</button>`}else if(m.type==='chatCharge'){title='채팅방을 시작할까요?';body=`대화방을 처음 열면 100P가 사용됩니다.<br>현재 보유 ${state.points.toLocaleString()}P`;actions=`<button class="action gray" onclick="modal=null;render()">취소</button><button class="action" onclick="confirmChat(${m.id})">채팅방 입장</button>`}else if(m.type==='existingChat'){title='기존 채팅방 안내';body='상대와 채팅한 이력이 있습니다. 채팅방으로 이동할까요?';actions=`<button class="action gray" onclick="modal=null;render()">취소</button><button class="action" onclick="openChat(${m.id},false)">이동하기</button>`}else if(m.type==='blockedByOther'){title='메시지를 보낼 수 없습니다';body='상대가 회원님을 차단하였습니다.';actions=`<button class="action" onclick="modal=null;render()">확인</button>`}else if(m.type==='profileRequired'){title='프로필 등록 안내';body='먼저 프로필을 등록해주세요';actions=`<button class="action gray" onclick="modal=null;render()">닫기</button><button class="action" onclick="modal=null;go('edit')">등록하기</button>`}else if(m.type==='leave'){title='저장하지 않은 정보가 있습니다';body='입력하신 정보가 저장되지 않습니다. 그래도 나갈까요?';actions=`<button class="action gray" onclick="dirty=false;modal=null;page='main';render()">나가기</button><button class="action" onclick="modal=null;render()">머무르기</button>`}else if(m.type==='demoCharge'){title='테스트 포인트 충전';body=`${m.amount.toLocaleString()}P를 추가하시겠습니까?<br>실제 결제는 발생하지 않습니다.`;actions=`<button class="action gray" onclick="modal=null;render()">취소</button><button class="action" onclick="state.points+=${m.amount};save();modal=null;render();notify('테스트 포인트가 충전되었습니다.')">충전</button>`}else if(m.type==='deleteChat'){title='채팅방을 나갈까요?';body='채팅방을 나가면 대화 기록이 삭제됩니다.';actions=`<button class="action gray" onclick="modal=null;render()">취소</button><button class="action danger" onclick="deleteChat()">삭제</button>`}else if(m.type==='needlogin'){title='로그인이 필요합니다';body='채팅 기능은 로그인 후 이용할 수 있습니다.';actions=`<button class="action gray" onclick="modal=null;render()">취소</button><button class="action" onclick="modal=null;go('login')">로그인</button>`}else if(m.type==='noPoints'){title='포인트가 부족합니다';body='채팅방을 시작하려면 100P가 필요합니다.';actions=`<button class="action gray" onclick="modal=null;render()">취소</button><button class="action" onclick="modal=null;go('points')">충전하기</button>`}else if(m.type==='report'){title='신고하기';body='시제품에서는 신고 접수 기능을 실제 운영팀으로 전송하지 않습니다.';actions=`<button class="action" onclick="modal=null;render();notify('신고 기능은 서버 연결 후 활성화됩니다.')">확인</button>`}return `<div class="overlay"><div class="confirm"><h3>${title}</h3><p>${body}</p><div class="buttons">${actions}</div></div></div>`}function unblock(id){mbChangeRelation(id,'unblock')}function doBlock(id){modal=null;mbChangeRelation(id,'block')}function deleteChat(){delete state.chats[chatId];save();modal=null;menu=false;nav('chats');notify('채팅방에서 나왔습니다.')}function render(){app.innerHTML=page==='main'?({find,friends,chats,more}[state.tab]||find)():page==='chat'?chatPage():page==='write'?writePage():page==='points'?pointsPage():page==='edit'?editPage():page==='login'?loginPage():['terms','help','withdraw'].includes(page)?infoPage():find();if(modal)app.insertAdjacentHTML('beforeend',modal.type==='profile'?profileModal():modal.type==='member'?mbMemberModal():confirm());if(page==='chat')scrollChat();if(page==='edit'&&restoreEditScroll!==null){const el=document.getElementById('editScroller');if(el)el.scrollTop=restoreEditScroll;restoreEditScroll=null}}render();

/* MEETBRIDGE v0.7 — single-file update detection (GitHub Pages) */
(function(){
  'use strict';
  var CURRENT_VERSION='0.15.1';
  var lastCheck=0, checking=false, dismissedVersion='';
  var ACK_KEY='meetbridge_update_accepted_version';
  function acceptedVersion(){try{return localStorage.getItem(ACK_KEY)||'';}catch(e){return '';}}
  function rememberAccepted(v){try{localStorage.setItem(ACK_KEY,v);}catch(e){}}
  function updateUrl(){return new URL('index.html',window.location.href);}
  function versionNumber(v){return String(v||'').split('.').map(function(n){return Number(n)||0;});}
  function isNewer(remote,local){var a=versionNumber(remote),b=versionNumber(local);for(var i=0;i<Math.max(a.length,b.length);i++){if((a[i]||0)!==(b[i]||0))return (a[i]||0)>(b[i]||0);}return false;}
  function showUpdate(version){
    if(document.getElementById('mb-update-overlay')||dismissedVersion===version)return;
    var accepted=acceptedVersion();
    if(accepted && !isNewer(version,accepted))return;
    var overlay=document.createElement('div');overlay.id='mb-update-overlay';
    var card=document.createElement('div');card.id='mb-update-card';card.setAttribute('role','dialog');card.setAttribute('aria-modal','true');card.setAttribute('aria-label','업데이트 안내');
    var title=document.createElement('h2');title.textContent='새 버전이 준비됐어요!';
    var desc=document.createElement('p');desc.textContent='MEETBRIDGE v'+version+' 업데이트가 있습니다. 최신 화면으로 새로고침하시겠습니까? 작성 중인 내용은 저장되지 않을 수 있습니다.';
    var actions=document.createElement('div');actions.className='mb-update-actions';
    var later=document.createElement('button');later.className='mb-later';later.textContent='나중에';later.onclick=function(){dismissedVersion=version;overlay.remove();};
    var now=document.createElement('button');now.className='mb-now';now.textContent='지금 업데이트';now.onclick=function(){rememberAccepted(version);var u=updateUrl();u.searchParams.set('v',version);u.searchParams.set('_mb',String(Date.now()));window.location.replace(u.href);};
    actions.append(later,now);card.append(title,desc,actions);overlay.appendChild(card);document.body.appendChild(overlay);
  }
  async function checkUpdate(force){
    if(checking||(!force&&Date.now()-lastCheck<30000))return;checking=true;lastCheck=Date.now();
    try{
      var url=updateUrl();url.searchParams.set('_mb_check',String(Date.now()));
      var response=await fetch(url.href,{cache:'no-store',redirect:'follow'});
      if(!response.ok)return;
      var html=await response.text();
      var match=html.match(/<meta\s+name=["']meetbridge-version["']\s+content=["']([0-9.]+)["']/i);
      if(match&&isNewer(match[1],CURRENT_VERSION)&&isNewer(match[1],acceptedVersion()))showUpdate(match[1]);
    }catch(err){/* Offline: keep current version usable. */}
    finally{checking=false;}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){checkUpdate(true);});else checkUpdate(true);
  window.addEventListener('pageshow',function(e){if(e.persisted){dismissedVersion='';checkUpdate(true);}});
  document.addEventListener('visibilitychange',function(){if(!document.hidden){dismissedVersion='';checkUpdate(true);}});
  window.addEventListener('focus',function(){checkUpdate(false);});
  setInterval(function(){if(!document.hidden)checkUpdate(false);},90000);
})();
</script></body></html>
