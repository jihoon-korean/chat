const KEY='meetbridge-demo-v2';const sample=[['하늘','여',23,'오늘 만날 사람 찾아요',18,1],['오늘도','남',30,'오늘 만날 사람 찾아요',8,1],['다온','여',23,'오늘 만날 사람 찾아요',18,3],['소라','여',23,'주말에 커피 마실 분?',3,11],['바다','남',28,'편하게 대화할 친구 구해요',12,11],['별이','여',26,'영화 같이 볼 분?',5,11],['햇살','여',23,'오늘 만날 사람 찾아요',18,11],['연두','남',31,'산책하며 이야기해요',7,15]].map((a,i)=>({id:i+1,name:a[0],gender:a[1],age:a[2],title:a[3],km:a[4],mins:a[5],intro:'안녕하세요. 성격좋고 쿨한 분을 찾고 있어요! 채팅주세요!',photos:[],spec:{키:'170',몸무게:'48',가슴:'B',허리:'24',힙:'35',외모스타일:'강아지',체형스타일:'날씬',MBTI:'ENFP',흡연:'전혀 안함',음주:'전혀 안함'}}));
const DEMO_PORTRAITS=["https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=350&q=78", "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=350&q=78", "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=350&q=78", "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=350&q=78", "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=350&q=78", "https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=350&q=78", "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=350&q=78", "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=350&q=78"];function defaults(){return {points:3500,loggedIn:true,tab:'find',filter:'전체',friendFilter:'관심',posts:sample,likes:[],blocks:[],memos:{},chats:{},profile:{name:'',gender:'',age:29,image:'',spec:{키:'',몸무게:'',가슴:'선택안함',허리:'',힙:'',외모스타일:'선택안함',체형스타일:'선택안함',MBTI:'선택안함',흡연:'선택안함',음주:'선택안함'},intro:'',photos:[]},checkin:'',profileSaved:false,incomingBlocks:[]}}let state;try{state={...defaults(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state=defaults()}if(!state.profileSaved && !state.profile?.image && !state.profile?.photos?.length){const blank=defaults().profile;state.profile={...blank,age:state.profile?.age||blank.age}}state.profileSaved=!!state.profileSaved;state.incomingBlocks=state.incomingBlocks||[];let viewerIndex=0,viewerImages=[],restoreEditScroll=null;let page='main',profileId=null,profileTab='프로필',modal=null,menu=false,editDraft=null,dirty=false,chatId=null,toastTimer,modalReturn=null;const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));function notify(msg){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=msg;app.append(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),2300)}function nav(tab){page='main';state.tab=tab;menu=false;save();render()}function head(){return `<div class="head"><div class="brand">MEETBRIDGE</div><button class="points" onclick="go('points')">${state.points.toLocaleString()}P &gt;</button></div>`}function bottom(){return `<div class="bottom">${[['find','⌂','친구찾기'],['friends','♡','내친구'],['chats','✉','채팅'],['more','●','더보기']].map(([k,icon,label])=>`<button class="navbtn ${state.tab===k?'on':''}" onclick="nav('${k}')"><span class="navwrap"><span class="navico">${icon}</span>${k==='chats'&&Object.keys(state.chats).length?'<span class="dot"></span>':''}</span><span>${label}</span></button>`).join('')}</div>`}function sub(title,back="back()",right=''){return `<div class="subhead"><button class="back" onclick="${back}">‹</button><strong style="flex:1">${title}</strong>${right}</div>`}function avatar(p,cl=''){const idx=state.posts.findIndex(x=>x.id===p.id);const url=p.image||((p.id!==0&&idx>=0)?DEMO_PORTRAITS[idx%DEMO_PORTRAITS.length]:'');return `<div class="avatar ${cl}" onclick="event.stopPropagation();openProfile(${p.id})" role="button" tabindex="0">${url?`<img src="${esc(url)}" alt="프로필 사진" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('beforeend','프로필 이미지')">`:'프로필<br>이미지'}</div>`}
function ident(p){return `<span class="ident ${p.gender==='남'?'man':''}">${esc(p.gender)} ${esc(p.age)}세. ${esc(p.name)}</span>`}function card(p,chat=false,blocked=false){return `<div class="card ${blocked?'blocked':''}">${avatar(p)}<div class="cardbody" ${chat?`onclick="openChat(${p.id},false)"`:''}>${ident(p)}<div class="headline">${esc(chat?(state.chats[p.id]?.at(-1)?.text||'대화가 시작되었습니다'):p.title)}</div><div class="meta">${chat?'최근 대화':`${p.mins}분전`}&nbsp; ${p.km}km</div></div>${chat?'':blocked?`<button class="chatbtn" onclick="unblock(${p.id})">차단 해제</button>`:`<button class="chatbtn" onclick="openChat(${p.id},true)">채팅</button>`}</div>`}
function find(){const posts=state.posts.filter(p=>({'전체':true,'지역':p.km<=30,'동네':p.km<=10,'근처':p.km<=5}[state.filter]));return `${head()}<div class="tabs">${['전체','지역','동네','근처'].map(t=>`<button class="pill ${state.filter===t?'on':''}" onclick="state.filter='${t}';save();render()">${t}</button>`).join('')}<button class="write" onclick="go('write')">글쓰기</button></div><div class="scroller"><div class="feed">${posts.map(p=>card(p)).join('')||'<div class="empty">해당 범위의 게시글이 없습니다.</div>'}</div></div>${bottom()}`}
function friends(){const blocked=state.friendFilter==='차단';const list=(blocked?state.blocks:state.likes).map(id=>state.posts.find(p=>p.id===id)).filter(Boolean);return `${head()}<div class="tabs">${['관심','차단'].map(t=>`<button class="pill ${state.friendFilter===t?'on':''}" onclick="state.friendFilter='${t}';save();render()">${t}</button>`).join('')}</div><div class="scroller"><div class="feed">${list.map(p=>card(p,false,blocked)).join('')||`<div class="empty">${blocked?'차단한 친구가 없습니다.':'관심 등록 친구가 없네요.<br>친구찾기에서 마음에 드는 친구를 찾아보세요.'}</div>`}</div></div>${bottom()}`}
function chats(){const list=Object.keys(state.chats).map(id=>state.posts.find(p=>p.id===Number(id))).filter(Boolean);return `${head()}<div class="scroller"><div class="feed">${list.map(p=>card(p,true)).join('')||'<div class="empty">아직 시작한 대화가 없습니다.</div>'}</div></div>${bottom()}`}function more(){return `${head()}<div class="scroller">${state.loggedIn?`<div class="section"><div class="row"><b>${esc(state.profile.name)}</b><span class="badge">로그인 중</span></div><div class="row"><button class="action gray" onclick="go('edit')">프로필 수정</button><button class="action outline" onclick="previewMyProfile()">내 프로필 미리보기</button></div></div>`:`<div class="section"><h3>로그인하고 연애 상대 찾기</h3><button class="action" onclick="go('login')">로그인 / 회원가입</button></div>`}<div class="section" style="padding:0 17px"><div class="row" onclick="go('points')" style="cursor:pointer"><div><b>포인트 충전하기</b><div class="tiny">현재 ${state.points.toLocaleString()}P</div></div><span>›</span></div><div class="row" onclick="checkin()" style="cursor:pointer"><div><b>무료 포인트 받기</b><div class="tiny">매일 출석체크하고 50P 받기</div></div><span>›</span></div></div><div class="section" style="padding:0 17px"><div class="row"><div><b>개인정보 및 약관</b><div class="tiny">개인정보 처리방침 / 이용약관</div></div><span>›</span></div><div class="row"><div><b>고객센터</b><div class="tiny">공지 / 문의하기</div></div><span>›</span></div><div class="row" onclick="state.loggedIn=!state.loggedIn;save();render()" style="cursor:pointer"><div><b>${state.loggedIn?'로그아웃':'로그인'}</b><div class="tiny">${state.loggedIn?'현재 기기에서 로그아웃':'서비스 이용을 시작하세요'}</div></div><span>›</span></div></div><div class="empty">회원 탈퇴</div></div>${bottom()}`}function previewMyProfile(){if(!state.profileSaved){modal={type:'profileRequired'};render();return}profileTab='프로필';modal={type:'profile',own:true};render()}function checkin(){const today=new Date().toISOString().slice(0,10);if(state.checkin===today)return notify('오늘은 이미 출석하셨습니다.');state.checkin=today;state.points+=50;save();render();notify('출석 완료! 50P가 적립되었습니다.')}function go(p){page=p;menu=false;if(p==='edit'){editDraft=JSON.parse(JSON.stringify(state.profile));dirty=false}render()}function back(){if(page==='edit'&&dirty){modal={type:'leave'};render();return}if(page==='chat'){page='main';state.tab='chats'}else page='main';menu=false;render()}function openProfile(id){profileId=id;profileTab='프로필';modal={type:'profile',id};render()}
function openAvatarViewer(own,id){const p=own?state.profile:state.posts.find(x=>x.id===id);if(!p)return;const idx=state.posts.findIndex(x=>x.id===id);const url=p.image||(!own&&idx>=0?DEMO_PORTRAITS[idx%DEMO_PORTRAITS.length]:'');if(!url)return notify('등록된 프로필 사진이 없습니다.');viewerImages=[url];viewerIndex=0;showViewer()}function profileModal(){const own=modal?.own;const p=own?{id:0,name:state.profile.name,gender:state.profile.gender,age:state.profile.age,km:0,image:state.profile.image,intro:state.profile.intro,photos:state.profile.photos,spec:state.profile.spec,online:true}:state.posts.find(x=>x.id===profileId);if(p&&!own)p.online=p.id===1||p.id===3;if(!p)return '';const isLike=state.likes.includes(p.id);const details=Object.entries(p.spec||{}).map(([k,v])=>`<span>${esc(k)}</span><span>${esc(v)}${k==='키'&&v?' cm':k==='몸무게'&&v?' kg':''}</span>`).join('');let content=profileTab==='프로필'?`<div class="spec">${details}</div>`:profileTab==='소개글'?`<div style="white-space:pre-wrap;line-height:1.8">${esc(p.intro||'등록된 소개글이 없습니다.')}</div>`:profileTab==='사진'?`<div class="photos">${(p.photos||[]).slice(0,6).map((src,i)=>`<div class="photo"><img src="${esc(src)}" alt="등록한 사진 ${i+1}" style="width:100%;height:100%;object-fit:cover"></div>`).join('')||'<div class="empty">등록된 사진이 없습니다.</div>'}</div>`:profileTab==='메모하기'?`<textarea class="wide memo-box" id="memo" maxlength="500" placeholder="상대방의 특징을 메모로 남겨보세요." onbeforeinput="memoBeforeInput(event)" onpaste="memoPaste(event)" oninput="if(this.value.length>500){this.value=this.value.slice(0,500);notify('최대 500자까지 입력할 수 있습니다.')}">${esc(state.memos[p.id]||'')}</textarea><div class="sectionfoot"><span class="tiny memo-limit">최대 500자</span> <button class="action" onclick="saveMemo(${p.id})">저장</button></div>`:'';return `<div class="modalbg" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modalSummary"><div class="modal-avatar-tap" onclick="event.stopPropagation();openAvatarViewer(${own?'true':'false'},${p.id})">${avatar(p,'large')}</div><div class="grow">${p.online?'<div class="online">접속중</div>':''}${ident(p)}<div class="meta" style="margin-top:5px">${own?'내 프로필':p.km+'km'}</div></div>${own?'':`<button class="action ${isLike?'gray':''}" onclick="toggleLike(${p.id})">${isLike?'관심 해제':'관심'}</button><button class="action gray" onclick="openChat(${p.id},true)">채팅</button>`}</div><div class="modtabs" id="modtabs">${(own?['프로필','소개글','사진']:['프로필','소개글','사진','메모하기','차단하기']).map(t=>`<button class="${profileTab===t?'on':''}" onclick="profileTabClick('${t}')">${t}</button>`).join('')}</div><div class="modalcontent" id="modalcontent" ontouchstart="modalTouchStart(event)" ontouchend="modalTouchEnd(event)">${content}</div><div class="modalfooter"><button onclick="modal=null;render()" style="background:none;padding:5px 30px">닫기</button></div></div></div>`}
let modalTouchX=0,modalTouchY=0;function modalTouchStart(e){modalTouchX=e.changedTouches[0].clientX;modalTouchY=e.changedTouches[0].clientY}function modalTouchEnd(e){const dx=e.changedTouches[0].clientX-modalTouchX,dy=e.changedTouches[0].clientY-modalTouchY;if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.4)return;const tabs=modal?.own?['프로필','소개글','사진']:['프로필','소개글','사진','메모하기'];const i=tabs.indexOf(profileTab);if(i<0)return;const j=i+(dx<0?1:-1);if(j>=0&&j<tabs.length)profileTabClick(tabs[j])}function memoBeforeInput(e){const v=e.target.value,selected=e.target.selectionEnd-e.target.selectionStart;const addition=e.data||'';if(v.length-selected+addition.length>500){e.preventDefault();notify('최대 500자까지 입력할 수 있습니다.')}}function memoPaste(e){const v=e.target.value,selected=e.target.selectionEnd-e.target.selectionStart,txt=e.clipboardData.getData('text');if(v.length-selected+txt.length>500){e.preventDefault();notify('최대 500자까지 입력할 수 있습니다.')}}function profileTabClick(t){if(t==='차단하기'){modal={type:'block',id:profileId};render();return}profileTab=t;render()}
function closeModal(e){if(e.target.classList.contains('modalbg')){modal=null;render()}}function toggleLike(id){state.likes=state.likes.includes(id)?state.likes.filter(x=>x!==id):[...state.likes,id];save();render();notify(state.likes.includes(id)?'관심 친구로 등록했습니다.':'관심을 해제했습니다.')}function saveMemo(id){state.memos[id]=document.getElementById('memo').value;save();notify('메모를 저장했습니다.')}function openChat(id,charge){if(state.blocks.includes(Number(id))){modal={type:'selfBlocked'};render();return}if(!state.loggedIn){modal={type:'needlogin'};render();return}if(state.incomingBlocks.includes(id)){modal={type:'blockedByOther'};render();return}chatId=id;const existing=Object.prototype.hasOwnProperty.call(state.chats,id);if(charge&&existing){modal={type:'existingChat',id};render();return}if(charge&&!existing){if(state.points<100){modal={type:'noPoints'};render();return}modal={type:'chatCharge',id};render();return}state.chats[id]??=[];page='chat';modal=null;menu=false;save();render()}
function confirmChat(id){if(state.incomingBlocks.includes(id)){modal={type:'blockedByOther'};render();return}if(state.points<100){modal={type:'noPoints'};render();return}state.points-=100;state.chats[id]=[];save();openChat(id,false)}
function chatPage(){if(state.blocks.includes(Number(chatId))){page='main';state.tab='chats';modal={type:'selfBlocked'};return chats()}const p=state.posts.find(x=>x.id===chatId);if(!p)return '';const msgs=state.chats[chatId]||[];const images=msgs.filter(m=>m.image).map(m=>m.image);return `${sub(`<button class="chat-heart ${state.likes.includes(p.id)?'liked':''}" onclick="toggleChatLike(${p.id})" aria-label="관심 등록 전환">${state.likes.includes(p.id)?'♥':'♡'}</button> ${esc(p.name)}　<span style="color:var(--pink)">${p.gender} ${p.age}세</span>　${p.km}km`,'back()',`<button class="profile-quick" onclick="openProfile(${p.id})">프로필</button><button class="close" onclick="menu=!menu;render()">⋮</button>`)}${menu?`<div class="floating"><button onclick="modal={type:'deleteChat'};render()">채팅방 나가기</button><button onclick="modal={type:'block',id:${p.id}};render()">차단하기</button><button onclick="modal={type:'report'};render()">신고하기</button></div>`:''}<div class="chatbody"><div class="messages" id="messages"><div class="datepill">오늘</div>${msgs.map(m=>`<div class="bubbleline ${m.mine?'mine':''}">${m.mine?`<span class="time">${m.time}</span>`:''}<div class="bubble">${m.image?`<img class="chat-photo" src="${m.image}" onclick="openViewer(${images.indexOf(m.image)})" alt="채팅 사진 크게 보기">`:esc(m.text)}</div>${!m.mine?`<span class="time">${m.time}</span>`:''}</div>`).join('')}</div><div class="composer"><button class="attach" onclick="document.getElementById('chatFile').click()">＋</button><input id="chatFile" type="file" accept="image/*" hidden onchange="chatImage(event)"><input id="chatText" placeholder="메시지를 입력하세요" onkeydown="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()">전송</button></div></div>`}
function toggleChatLike(id){state.likes=state.likes.includes(id)?state.likes.filter(x=>x!==id):[...state.likes,id];save();render();notify(state.likes.includes(id)?'관심 친구로 등록했습니다.':'관심을 해제했습니다.')}function openViewer(i){viewerImages=(state.chats[chatId]||[]).filter(m=>m.image).map(m=>m.image);viewerIndex=Math.max(0,Math.min(i,viewerImages.length-1));showViewer()}function showViewer(){document.getElementById('viewer')?.remove();if(!viewerImages.length)return;const v=document.createElement('div');v.id='viewer';v.className='viewer';v.innerHTML=`<button class="viewer-close" onclick="document.getElementById('viewer').remove()">×</button><button class="viewer-arrow prev" onclick="moveViewer(-1)">‹</button><img src="${viewerImages[viewerIndex]}" alt="채팅 사진 확대" draggable="false"><button class="viewer-arrow next" onclick="moveViewer(1)">›</button><div class="viewer-count">${viewerIndex+1} / ${viewerImages.length}</div>`;let sx=0,sy=0,drag=false;v.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;sx=e.clientX;sy=e.clientY;drag=true;try{v.setPointerCapture(e.pointerId)}catch(_){}});v.addEventListener('pointerup',e=>{if(!drag)return;drag=false;const dx=e.clientX-sx;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(e.clientY-sy)*1.15)moveViewer(dx<0?1:-1)});v.addEventListener('pointercancel',()=>drag=false);v.addEventListener('dragstart',e=>e.preventDefault());app.append(v)}function moveViewer(dir){viewerIndex=(viewerIndex+dir+viewerImages.length)%viewerImages.length;showViewer()}function sendMessage(){if(state.blocks.includes(Number(chatId))){modal={type:'selfBlocked'};render();return}if(state.incomingBlocks.includes(Number(chatId))){modal={type:'blockedByOther'};render();return}const input=document.getElementById('chatText'),v=input.value.trim();if(!v)return;state.chats[chatId].push({mine:true,text:v,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})});save();render();scrollChat()}function chatImage(e){if(state.blocks.includes(Number(chatId))){modal={type:'selfBlocked'};render();return}if(state.incomingBlocks.includes(Number(chatId))){modal={type:'blockedByOther'};render();return}const file=e.target.files[0];if(!file)return;readFile(file,src=>{state.chats[chatId].push({mine:true,image:src,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})});save();render();scrollChat()})}function scrollChat(){const el=document.getElementById('messages');if(el)el.scrollTop=el.scrollHeight}function writePage(){return `${sub('글쓰기')}<div class="scroller"><div class="section"><div class="sectiontitle">새 게시글 작성</div><div class="note">친구찾기 목록에 표시할 제목을 작성해 주세요.</div><input id="postTitle" maxlength="60" placeholder="예: 오늘 같이 커피 마실 분?" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:7px;margin:12px 0"><div class="sectionfoot"><button class="action" onclick="addPost()">등록하기</button></div></div></div>`}function addPost(){const title=document.getElementById('postTitle').value.trim();if(!title)return notify('제목을 입력해 주세요.');const id=Math.max(0,...state.posts.map(p=>p.id))+1;state.posts.unshift({id,name:state.profile.name,gender:state.profile.gender,age:state.profile.age,title,km:0,mins:0,image:state.profile.image,intro:state.profile.intro,photos:state.profile.photos,spec:state.profile.spec});save();nav('find');notify('게시글이 등록되었습니다')}function pointsPage(){return `${sub('포인트 충전')}<div class="scroller"><div class="section" style="background:#fff0f5"><div class="tiny">보유 포인트</div><h1 style="color:var(--pink);margin:10px 0">${state.points.toLocaleString()} P</h1></div><div class="section"><div class="sectiontitle">포인트 충전 상품</div>${[500,1000,3000,5000].map(n=>`<div class="row"><div><b>${n.toLocaleString()} P</b><div class="tiny">${(n*1.1).toLocaleString('ko-KR')}원 (부가세 포함)</div></div><button class="action outline" onclick="demoCharge(${n})">선택</button></div>`).join('')}<p class="note">시제품에서는 실제 결제가 이루어지지 않습니다. 상품을 선택하면 테스트 포인트가 추가됩니다. 실제 출시 시 앱스토어 결제 및 환불 정책을 연동해야 합니다.</p></div></div>`}function demoCharge(n){modal={type:'demoCharge',amount:n};render()}function loginPage(){return `${sub('로그인')}<div class="scroller"><div class="auth"><h2>MEETBRIDGE</h2><p class="tiny">시제품용 로그인입니다. 실제 본인인증은 연결되어 있지 않습니다.</p><input placeholder="이메일"><input placeholder="비밀번호" type="password"><button class="action" style="width:100%;margin-top:10px" onclick="state.loggedIn=true;save();nav('more');notify('시제품 로그인 완료')">로그인</button></div></div>`}function editPage(){const p=editDraft;const opts={가슴:['선택안함','해당없음','A','B','C','D','E','F'],외모스타일:['선택안함','강아지','고양이','깔끔','귀여운','시크','기타'],체형스타일:['선택안함','날씬','보통','탄탄','근육형','통통'],MBTI:['선택안함',...'ISTJ ISFJ INFJ INTJ ISTP ISFP INFP INTP ESTP ESFP ENFP ENTP ESTJ ESFJ ENFJ ENTJ'.split(' ')],흡연:['선택안함','전혀 안함','가끔','자주'],음주:['선택안함','전혀 안함','가끔','자주']};return `${sub('프로필 수정')}<div class="scroller" id="editScroller"><div class="section"><div class="sectiontitle">기본정보</div><div style="display:flex;gap:14px;align-items:center"><div class="avatar-edit"><div class="avatar large" style="border-radius:50%" onclick="document.getElementById('avatarFile').click()">${p.image?`<img src="${p.image}">`:'＋<br>프로필'}</div><button class="delete-avatar" onclick="deleteAvatar()">삭제</button><input id="avatarFile" hidden type="file" accept="image/*" onchange="changeAvatar(event)"></div><div style="flex:1;min-width:0"><div class="field"><label style="width:65px">성별</label><div class="gender-group"><label><input type="radio" name="gender" value="남" ${p.gender==='남'?'checked':''} onchange="updateBasic('gender','남')"> 남자</label><label><input type="radio" name="gender" value="여" ${p.gender==='여'?'checked':''} onchange="updateBasic('gender','여')"> 여자</label></div></div><div class="field"><label style="width:65px">닉네임</label><input value="${esc(p.name)}" oninput="updateBasic('name',this.value)"></div><div class="field"><label style="width:65px">나이</label><input value="${p.age}세 (본인인증 기준)" readonly></div></div></div><div class="sectionfoot"><button class="action" onclick="saveBasic()">저장</button></div></div><div class="section"><div class="sectiontitle" style="color:var(--pink)">프로필</div>${Object.entries(p.spec).map(([k,v])=>`<div class="field"><label>${esc(k)}</label>${opts[k]?`<select onchange="updateSpec('${k}',this.value)">${opts[k].map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<div class="unit-wrap"><input value="${esc(v)}" inputmode="decimal" inputmode="numeric" pattern="[0-9]*" oninput="this.value=this.value.replace(/[^0-9]/g,'');updateSpec('${k}',this.value)">${['키','몸무게'].includes(k)?`<span class="unit">${k==='키'?'cm':'kg'}</span>`:''}</div>`}</div>`).join('')}<div class="sectionfoot"><button class="action" onclick="saveSpec()">저장</button></div></div><div class="section"><div class="sectiontitle" style="color:var(--pink)">소개글</div><textarea class="wide" placeholder="정성스러운 소개일수록 매칭 성공률이 높아집니다" oninput="editDraft.intro=this.value;dirty=true">${esc(p.intro)}</textarea><div class="sectionfoot"><button class="action" onclick="saveIntro()">저장</button></div></div><div class="section"><div class="sectiontitle" style="color:var(--pink)">사진 <span class="tiny">최대 6장 · 업로드 즉시 저장</span></div><div class="photogrid">${Array.from({length:6},(_,i)=>p.photos[i]?`<div class="photocell"><img src="${p.photos[i]}"><button class="remove" onclick="removePhoto(${i})">×</button></div>`:`<div class="photocell" onclick="document.getElementById('photoFile').click()" style="cursor:pointer;color:#999;font-size:28px">＋</div>`).join('')}</div><input type="file" id="photoFile" accept="image/*" multiple hidden onchange="uploadPhotos(event)"></div></div>${bottom()}`}
function updateBasic(k,v){editDraft[k]=v;dirty=true}function updateSpec(k,v){editDraft.spec[k]=v;dirty=true}function saveBasic(){state.profile.name=editDraft.name;state.profile.gender=editDraft.gender;state.profile.image=editDraft.image;state.profileSaved=true;save();dirty=hasUnsaved();notify('기본정보를 저장했습니다.')}function saveSpec(){state.profile.spec=JSON.parse(JSON.stringify(editDraft.spec));state.profileSaved=true;save();dirty=hasUnsaved();notify('프로필을 저장했습니다.')}function saveIntro(){state.profile.intro=editDraft.intro;state.profileSaved=true;save();dirty=hasUnsaved();notify('소개글을 저장했습니다.')}function hasUnsaved(){return ['name','gender','image','intro'].some(k=>state.profile[k]!==editDraft[k])||JSON.stringify(state.profile.spec)!==JSON.stringify(editDraft.spec)}function readFile(file,cb){if(file.size>5*1024*1024){notify('5MB 이하 이미지를 선택해 주세요.');return}const reader=new FileReader();reader.onload=()=>cb(reader.result);reader.readAsDataURL(file)}function deleteAvatar(){const el=document.getElementById('editScroller');restoreEditScroll=el?.scrollTop||0;editDraft.image='';dirty=true;render();notify('기본 프로필 이미지로 변경했습니다. 저장 버튼을 눌러 반영하세요.')}function changeAvatar(e){const file=e.target.files[0];if(!file)return;readFile(file,src=>{restoreEditScroll=document.getElementById('editScroller')?.scrollTop||0;editDraft.image=src;dirty=true;render()})}function uploadPhotos(e){const files=[...e.target.files].slice(0,6-editDraft.photos.length);if(!files.length)return notify('사진은 최대 6장까지 등록할 수 있습니다.');let done=0;files.forEach(file=>readFile(file,src=>{editDraft.photos.push(src);state.profile.photos=[...editDraft.photos];state.profileSaved=true;save();if(++done===files.length){restoreEditScroll=document.getElementById('editScroller')?.scrollTop||0;render();notify('사진이 즉시 저장되었습니다.')}}))}function removePhoto(i){editDraft.photos.splice(i,1);state.profile.photos=[...editDraft.photos];state.profileSaved=true;save();restoreEditScroll=document.getElementById('editScroller')?.scrollTop||0;render();notify('사진을 삭제했습니다.')}function confirm(){if(!modal)return '';const m=modal;let title='',body='',actions='';if(m.type==='selfBlocked'){title='채팅방을 열 수 없습니다';body='회원님이 차단한 상대입니다.';actions=`<button class="action" onclick="modal=null;render()">확인</button>`}else if(m.type==='block'){title='상대를 정말 차단할까요?';body='상대의 메세지를 차단할 수 있습니다.';actions=`<button class="action gray" onclick="modal={type:'profile'};render()">취소</button><button class="action danger" onclick="doBlock(${m.id})">차단하기</button>`}else if(m.type==='chatCharge'){title='채팅방을 시작할까요?';body=`대화방을 처음 열면 100P가 사용됩니다.<br>현재 보유 ${state.points.toLocaleString()}P`;actions=`<button class="action gray" onclick="modal=null;render()">취소</button><button class="action" onclick="confirmChat(${m.id})">채팅방 입장</button>`}else if(m.type==='existingChat'){title='기존 채팅방 안내';body='상대와 채팅한 이력이 있습니다. 채팅방으로 이동할까요?';actions=`<button class="action gray" onclick="modal=null;render()">취소</button><button class="action" onclick="openChat(${m.id},false)">이동하기</button>`}else if(m.type==='blockedByOther'){title='메시지를 보낼 수 없습니다';body='상대가 회원님을 차단하였습니다.';actions=`<button class="action" onclick="modal=null;render()">확인</button>`}else if(m.type==='profileRequired'){title='프로필 등록 안내';body='먼저 프로필을 등록해주세요';actions=`<button class="action gray" onclick="modal=null;render()">닫기</button><button class="action" onclick="modal=null;go('edit')">등록하기</button>`}else if(m.type==='leave'){title='저장하지 않은 정보가 있습니다';body='입력하신 정보가 저장되지 않습니다. 그래도 나갈까요?';actions=`<button class="action gray" onclick="dirty=false;modal=null;page='main';render()">나가기</button><button class="action" onclick="modal=null;render()">머무르기</button>`}else if(m.type==='demoCharge'){title='테스트 포인트 충전';body=`${m.amount.toLocaleString()}P를 추가하시겠습니까?<br>실제 결제는 발생하지 않습니다.`;actions=`<button class="action gray" onclick="modal=null;render()">취소</button><button class="action" onclick="state.points+=${m.amount};save();modal=null;render();notify('테스트 포인트가 충전되었습니다.')">충전</button>`}else if(m.type==='deleteChat'){title='채팅방을 나갈까요?';body='채팅방을 나가면 대화 기록이 삭제됩니다.';actions=`<button class="action gray" onclick="modal=null;render()">취소</button><button class="action danger" onclick="deleteChat()">삭제</button>`}else if(m.type==='needlogin'){title='로그인이 필요합니다';body='채팅 기능은 로그인 후 이용할 수 있습니다.';actions=`<button class="action gray" onclick="modal=null;render()">취소</button><button class="action" onclick="modal=null;go('login')">로그인</button>`}else if(m.type==='noPoints'){title='포인트가 부족합니다';body='채팅방을 시작하려면 100P가 필요합니다.';actions=`<button class="action gray" onclick="modal=null;render()">취소</button><button class="action" onclick="modal=null;go('points')">충전하기</button>`}else if(m.type==='report'){title='신고하기';body='시제품에서는 신고 접수 기능을 실제 운영팀으로 전송하지 않습니다.';actions=`<button class="action" onclick="modal=null;render();notify('신고 기능은 서버 연결 후 활성화됩니다.')">확인</button>`}return `<div class="overlay"><div class="confirm"><h3>${title}</h3><p>${body}</p><div class="buttons">${actions}</div></div></div>`}function unblock(id){state.blocks=state.blocks.filter(x=>x!==id);save();render();notify('차단을 해제했습니다.')}function doBlock(id){if(!state.blocks.includes(id))state.blocks.push(id);state.likes=state.likes.filter(x=>x!==id);save();modal=null;render();notify('상대를 차단했습니다.')}function deleteChat(){delete state.chats[chatId];save();modal=null;menu=false;nav('chats');notify('채팅방에서 나왔습니다.')}function render(){app.innerHTML=page==='main'?({find,friends,chats,more}[state.tab]||find)():page==='chat'?chatPage():page==='write'?writePage():page==='points'?pointsPage():page==='edit'?editPage():page==='login'?loginPage():find();if(modal)app.insertAdjacentHTML('beforeend',modal.type==='profile'?profileModal():confirm());if(page==='chat')scrollChat();if(page==='edit'&&restoreEditScroll!==null){const el=document.getElementById('editScroller');if(el)el.scrollTop=restoreEditScroll;restoreEditScroll=null}}render();
</script></body></html>
