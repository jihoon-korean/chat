(function(){'use strict';const $=id=>document.getElementById(id);function dialog(title,description){$('stage70DialogTitle').textContent=title;$('stage70DialogText').textContent=description;$('stage70Dialog').hidden=false}function close(){$('stage70Dialog').hidden=true} $('stage70Close').onclick=close;$('stage70Dialog').onclick=e=>{if(e.target===$('stage70Dialog'))close()};$('stage70Profile').onclick=()=>dialog('프로필','기존 프로필 버튼 보존 확인. 실제 회원 조회는 연결하지 않았습니다.');$('stage70Back').onclick=()=>dialog('뒤로가기','독립된 화면 검증용 페이지입니다.');$('stage70Attach').onclick=()=>dialog('사진 첨부','기존 첨부 버튼 디자인만 확인합니다.');$('stage70Composer').onsubmit=e=>{e.preventDefault();dialog('서버 미연결','이 화면은 디자인 검증용입니다. 메시지는 전송되지 않으며 포인트도 차감되지 않습니다.')};$('stage70More').onclick=()=>{const old=$('mbChatMoreMenu');if(old){old.remove();return}const menu=document.createElement('div');menu.className='mb-chat-menu';menu.id='mbChatMoreMenu';for(const title of ['채팅방 나가기','차단하기','신고하기']){const b=document.createElement('button');b.type='button';b.textContent=title;b.onclick=()=>{menu.remove();dialog(title,'기존 메뉴 디자인 및 클릭 동작 확인. 실제 서버 요청은 하지 않습니다.')};menu.append(b)}$('mbRealHeader').append(menu)};})();
</script></body></html>
